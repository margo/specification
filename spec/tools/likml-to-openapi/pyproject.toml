[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "margo-linkml-to-openapi"
version = "1.0.0"
description = "Fill OpenAPI templates with schemas generated from LinkML sources"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
linkml-to-openapi = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
