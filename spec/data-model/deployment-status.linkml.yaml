# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/deployment-status
name: DeploymentStatus
description: >-
  Defines the schema for reporting the operational status of a specific deployment and its individual components. 
  It tracks the progression of an installation through various lifecycles (such as pending, installing, 
  installed, or failed) and captures detailed error messaging if a failure occurs.
  Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md
version: "1.0.0"
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
imports:
  - linkml:types
  - types.linkml

default_prefix: margo
default_range: string

classes:
  DeploymentStatusManifest:
    description: >-
      Manifest sent by the device client to report the deployment status of a workload.
      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#request-body-attributes
    examples:
      - value: "examples/DeploymentStatusManifest-001.yaml"
        description: ""
    attributes:
      apiVersion:
        range: string
        required: true
      kind:
        range: string
        required: true
        equals_string: "DeploymentStatusManifest"
        designates_type: true
      deploymentId:
        description: >-
          The unique identifier of the deployment whose status is being reported.
        range: string
        required: true
      status:
        range: Status
        required: true
      components:
        description: >-
          Per-component status list.

          Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#component-attributes
        range: ComponentStatus
        required: true
        multivalued: true

  Status:
    description: >-
      Overall deployment state and optional error details.

      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#status-attributes
    slots:
      - state
      - error

  Error:
    description: >-
      Error details associated with a failed deployment state.

      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#error-attributes
    attributes:
      code:
        range: string
      message:
        range: string

  ComponentStatus:
    is_a: Status
    description: >-
      Status of a component deployment.
      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#component-attributes
    attributes:
      name:
        range: string
        required: true

slots:
  state:
    description: >-
      Current deployment state.

      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#status-attributes
    range: State
    required: true

  error:
    description: >-
      Optional error details when the state is `failed`.

      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#error-attributes
    range: Error

enums:
  State:
    description: >-
      Permissible deployment states.

      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/deployment-status.md#status-attributes
    permissible_values:
      pending:
      installing:
      installed:
      failed:
      removing:
      removed:
