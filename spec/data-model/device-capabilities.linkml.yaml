# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/device-capabilities
name: DeviceCapabilitiesSchema
title: Device Capabilities Schema
description: >-
  Schema for defining device capabilities.
  The purpose of the Device Capabilities is that WFMs can match application deployments with the capabilities of the target devices.

  Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/device-capabilities.md
version: "1.0.0"
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
imports:
  - linkml:types
  - types.linkml

default_prefix: margo
# default_range: string  # https://github.com/linkml/linkml/issues/1483

# Class Definitions
classes:
  DeviceCapabilitiesManifest:
    description: >-
      Capabilities of a device on which applications can be deployed.
      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/device-capabilities.md#request-body-attributes
    # examples:
    #   - value: "../resources/examples/valid/DeviceCapabilitiesManifest-001-standalone_cluster.json"
    #     description: "Manifest showing standalone cluster capabilities"
    #   - value: "../resources/examples/valid/DeviceCapabilitiesManifest-001-standalone_device.json"
    #     description: "Manifest showing standalone device capabilities"
    attributes:
      apiVersion:
        description: Identifier of the version the API resource follows.
        range: string
        required: true
      kind:
        description: Must be `DeviceCapabilitiesManifest`.
        range: string
        required: true
        equals_string: "DeviceCapabilitiesManifest"
        designates_type: true
      properties:
        description: >-
          Element that defines characteristics about the device.
          See the [Properties Attributes](#properties-attributes) section below.

          Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/device-capabilities.md#properties-attributes
        required: true
        range: Properties

  Properties:
    description: >-
      Device properties reported to the WFM.

      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/device-capabilities.md#properties-attributes
    attributes:
      id:
        description: Unique deviceID assigned to the device via the Device Owner.
        range: string
        required: true
      vendor:
        description: Defines the device vendor.
        range: string
        required: true
      modelNumber:
        description: Defines the model number of the device.
        range: string
        required: true
      serialNumber:
        description: Defines the serial number of the device.
        range: string
        required: true
      roles:
        description: >-
          Element that defines the device role it can provide to the Margo environment.
          MUST be one of the following: Standalone Cluster, Cluster Leader, or Standalone Device.

          Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/device-capabilities.md#enumerations
        required: true
        multivalued: true
        inlined: false
        range: DeviceRole
      resources:
        description: >-
          Element that defines the device's resources available to the application deployed on the device.
          See the [Resources Attributes](#resources-attributes) section below.

          Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/device-capabilities.md#resources-attributes
        required: true
        range: Resources

# Enumeration Definitions
enums:
  DeviceRole:
    description: >-
      Role a device can provide to the Margo environment.

      Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/specification/margo-management-interface/device-capabilities.md#enumerations
    permissible_values:
      Standalone Cluster:
        description: >-
          Select this role to run Helm applications.
          See [Edge compute devices](../../concepts/edge-compute-devices/devices#standalone-cluster-role-details) for more information.

          Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/concepts/edge-compute-devices/devices.md#standalone-cluster-role-details
      Standalone Device:
        description: >-
          Select this role to run Compose applications.
          See [Edge compute devices](../../concepts/edge-compute-devices/devices#standalone-device-role-details) for more information.

          Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/concepts/edge-compute-devices/devices.md#standalone-cluster-role-details

      Cluster Leader:
        description: >-
          Select this role for the leader node of a multi-node Helm cluster.
          See [Edge compute devices](../../concepts/edge-compute-devices/devices#cluster-leader-role-details) for more information.
          Pre-data-model reference https://github.com/margo/specification/blob/3519aa7be4b565b2e2395134b99778fdc0379ace/system-design/concepts/edge-compute-devices/devices.md#cluster-leader-role-details
