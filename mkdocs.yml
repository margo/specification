site_name: Specification (pre-draft)
docs_dir: build/site

nav:
  - What is Margo?: index.md
  - Specification:
      - Identity and Authorization:
          - specification/identity/identity-framework.md
          - specification/identity/svids.md
          - specification/identity/tls-requirements.md
          - specification/identity/trust-bundle-and-discovery.md
          - specification/identity/identity-lifecycle.md
          - specification/identity/wfm-identity-profile.md
          - specification/identity/identity-security-considerations.md
          - specification/identity/trust-bundle-api-swagger.md
      - Margo Management Interface:
          - specification/margo-management-interface/api-requirements-and-security.md
          - specification/margo-management-interface/device-capabilities-api.md
          - Device Capabilities: specification/margo-management-interface/device-capabilities.md
          - specification/margo-management-interface/desired-state.md
          - specification/margo-management-interface/deployment-status-api.md
          - Deployment Status: specification/margo-management-interface/deployment-status.md
          - specification/margo-management-interface/management-interface-swagger.md
      - Applications:
          - specification/applications/application-description.md
          - specification/applications/application-registry.md
      - Margo Devices:
          - specification/margo-devices/device-requirements.md
      - Observability:
          - specification/observability/publishing-workload-observability-data.md
          - specification/observability/collecting-workload-observability-data.md
          - specification/observability/consuming-workload-observability-data.md
      - Data Model:
          - Overview: data-model/index.md
          - ApplicationDescription: data-model/ApplicationDescription.md
          - ApplicationDeployment: data-model/ApplicationDeployment.md
          - DeviceCapabilitiesManifest: data-model/DeviceCapabilitiesManifest.md
          - DesiredStateManifest: data-model/DesiredStateManifest.md
          - DeploymentStatusManifest: data-model/DeploymentStatusManifest.md
      - Problem Types:
          - specification/problem-types.md
          - specification/problem-details.md
      - Specification Version Management:
          - specification/specification-version-management.md
theme:
  name: material
  features:
    #- navigation.tabs
    #- navigation.settings
    #- navigation.top
    #- navigation.sections
    - navigation.tracking
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotations
    - content.code.copy
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  logo: assets/margo_white.svg
  favicon: assets/favicon.ico
  palette:
    scheme: margo

markdown_extensions:
  - toc:
      toc_depth: 2
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - css/margo.css
  - assets/swagger-ui.css

extra_javascript:
  - assets/swagger-ui-bundle.js
  - assets/swagger-ui-standalone-preset.js
  - assets/svg-pan-zoom.min.js
  - assets/svg-pan-zoom-init.js

extra:
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/#generator-notice
  generator: true
  homepage: https://margo.org
  copyright: Copyright &copy; 2024 Margo
  reponame: !ENV [GITHUB_REPOSITORY, "margo/specification"]
  commit: !ENV [GITHUB_SHA, "<unknown>"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/margo
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/margo_project
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/margoproject/about/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@Margoinitiative
    - icon: fontawesome/brands/discord
      link: http://chat.margo.org/

plugins:
  - search
  - markdownextradata:
      jinja_options:
        variable_start_string: =@=
        variable_end_string: =@=
  - privacy
