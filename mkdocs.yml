site_name: Specification (pre-draft)
docs_dir: build/docs

nav:
  - What is Margo?: index.md
  - Specification:
      - Margo Management Interface:
          - system-design/specification/margo-management-interface/api-requirements-and-security.md
          - system-design/specification/margo-management-interface/certificate-api.md
          - system-design/specification/margo-management-interface/device-client-onboarding.md
          - system-design/specification/margo-management-interface/device-capabilities-api.md
          - Device Capabilities: system-design/specification/margo-management-interface/device-capabilities.md
          - system-design/specification/margo-management-interface/desired-state.md
          - system-design/specification/margo-management-interface/deployment-status-api.md
          - Deployment Status: system-design/specification/margo-management-interface/deployment-status.md
          - system-design/specification/margo-management-interface/management-interface-swagger.md
      - Applications:
          - system-design/specification/applications/application-description.md
          - system-design/specification/applications/application-registry.md
      - Margo Devices:
          - system-design/specification/margo-devices/device-requirements.md
      - Observability:
          - system-design/specification/observability/publishing-workload-observability-data.md
          - system-design/specification/observability/collecting-workload-observability-data.md
          - system-design/specification/observability/consuming-workload-observability-data.md
      - Data Model:
          - Overview: data-model/index.md
          - ApplicationDescription: data-model/ApplicationDescription.md
          - ApplicationDeployment: data-model/ApplicationDeployment.md
          - DeviceCapabilitiesManifest: data-model/DeviceCapabilitiesManifest.md
          - DesiredStateManifest: data-model/DesiredStateManifest.md
          - DeploymentStatusManifest: data-model/DeploymentStatusManifest.md
  - Make a Contribution:
      - make-a-contribution/contributing.md

theme:
  name: material
  features:
    #- navigation.tabs
    #- navigation.settings
    #- navigation.top
    #- navigation.sections
    - navigation.tracking
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotations
    - content.code.copy
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  logo: static/assets/margo_white.svg
  favicon: static/assets/favicon.ico
  palette:
    scheme: margo

markdown_extensions:
  - toc:
      toc_depth: 2
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - static/css/margo.css
  - static/assets/swagger-ui.css

extra_javascript:
  - static/assets/swagger-ui-bundle.js
  - static/assets/swagger-ui-standalone-preset.js
  - static/assets/svg-pan-zoom.min.js
  - static/assets/svg-pan-zoom-init.js

extra:
  # https://squidfunk.github.io/mkdocs-material/setup/setting-up-the-footer/#generator-notice
  generator: true
  homepage: https://margo.org
  copyright: Copyright &copy; 2024 Margo
  reponame: !ENV [GITHUB_REPOSITORY, "margo/specification"]
  commit: !ENV [GITHUB_SHA, "<unknown>"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/margo
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/margo_project
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/margoproject/about/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@Margoinitiative
    - icon: fontawesome/brands/discord
      link: http://chat.margo.org/

plugins:
  - search
  - markdownextradata:
      jinja_options:
        variable_start_string: =@=
        variable_end_string: =@=
  - privacy
