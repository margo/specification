# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/data-model
name: DataModel
title: Margo Data Model
description: >-
  Margo specification involves complex, interrelated data structures that are used for multiple, different purposes.

  This data model documents the mentioned data structures and their relationships.

  ??? info "General information about the Margo data model"

      The Margo data model has been modelled with **[LinkML](https://linkml.io)**
      a **modelling language** that does not only offer very poserfull modelling capabilities,
      but also very useful conversion and validation tooling.

      All **examples** shown on the documentation of the classes (see
      [ApplicationDescription](ApplicationDescription.md#examples) for an example) are being automatically validated
      against the model before a new version of the specification gets published.

      The whole [**HTML documentation** of the data model](.) is also automatically generated from the model.
      This documentation provides some graphics that help visualicing the relationship between classes.

      Also following **OpenAPI** v3.0.3 YAML specifications are being automatically generated from the model:

      - [workload-management-api-1.0.0.openapi.yaml](../specification/margo-management-interface/management-interface-swagger/)
version: 1.0.0
prefixes:
  margo: https://specification.margo.org/
imports:
  - application-deployment.linkml
  - application-description.linkml
  - desired-state-manifest.linkml
  - device-capabilities.linkml
  - deployment-status.linkml
  - problem-details.linkml

default_prefix: margo

subsets:
  api_resources:
    title: API Resources

types:
  ManifestVersion:
    description: >-
      Monotonically increasing unsigned 64-bit integer in the inclusive range [1, 2^64-1].
      Prevents rollback attacks. The first manifest MUST use 1.
    uri: xsd:unsignedLong
    base: int
    minimum_value: 1
    maximum_value: 18446744073709551615

  FlatDeviceId:
    description: >-
      Unique identifier of a device or device hierarchy.
      Format: "{id}[/{id}[/{id}...]]". The top-level id is required and must include only
      unreserved characters as specified in RFC3986. Subsequent ids indicate child devices
      in a gateway hierarchy and must also use only unreserved characters.
    uri: xsd:string
    base: str
    pattern: '^[A-Za-z0-9._~-]+(\/[A-Za-z0-9._~-]+)*$'

  HierarchicalDeviceId:
    uri: xsd:string
    base: str
    pattern: '^[A-Za-z0-9._~-]+(\/[A-Za-z0-9._~-]+)*(\/\*)?$'
