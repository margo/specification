openapi: 3.1.0
info:
  title: Margo Trust Bundle API
  version: 1.0.0
  description: >
    Read-only HTTPS endpoints served by the Margo Identity Service (MIS) role:
    an optional discovery document that points a client to the Trust Bundle,
    and the SPIFFE Bundle Map retrieval endpoint.


    Both endpoints are served over HTTPS. Because a client cannot yet validate
    MIAF-issued SVIDs when it first retrieves trust material, these connections
    are authenticated by an initial trust mechanism established outside MIAF
    (PKI-anchored validation or operator-provisioned pins), not by a MIAF SVID.
    There is therefore no application-layer security scheme on these endpoints.


    A client MUST tolerate unknown response fields so that future revisions can
    add fields without breaking existing implementations.

servers:
  - url: https://mis.example.com
    description: Margo Identity Service (illustrative origin)

security: []

paths:
  /.well-known/margo:
    get:
      summary: Retrieve the Trust Domain discovery document
      description: >
        Optional entry point to a Trust Domain that points a client to the
        Trust Bundle URI. Each document describes exactly one Trust Domain.
        An origin serving exactly one Trust Domain SHOULD expose the document
        at this well-known path per RFC 8615; an origin serving several Trust
        Domains MAY use other absolute HTTPS URLs. When discovery is not used,
        the Trust Domain identifier and Trust Bundle URI are supplied by
        operator-provided configuration.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Previously returned ETag; used to revalidate a cached copy.
      responses:
        '200':
          description: Discovery document
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for cache revalidation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        '304':
          description: Cached copy still valid
        '404':
          description: Discovery document not available

  /.well-known/spiffe/bundle.json:
    get:
      summary: Retrieve the SPIFFE Bundle Map
      description: >
        Returns the SPIFFE Bundle Map for the Trust Domain. The path shown here
        is illustrative; the authoritative location is the trustBundleUri value
        from the discovery document (or operator configuration). The entry keyed
        by the local trustDomain holds the authoritative set of public trust
        anchors for that Trust Domain. The response MUST conform to the SPIFFE
        Bundle Map format
        (https://github.com/spiffe/spiffe/blob/main/standards/SPIFFE_Trust_Domain_and_Bundle.md#5-spiffe-bundle-map).
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Previously returned ETag; used to revalidate a cached copy.
      responses:
        '200':
          description: SPIFFE Bundle Map
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for cache revalidation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpiffeBundleMap'
        '304':
          description: Cached copy still valid
        '404':
          description: Bundle unavailable

components:
  schemas:
    DiscoveryDocument:
      type: object
      required: [trustDomain, trustBundleUri]
      description: >
        Describes exactly one Trust Domain. Clients MUST ignore unknown fields.
      properties:
        trustDomain:
          type: string
          description: >
            Identifier of the Trust Domain (for example, factory.example).
            Every SPIFFE ID issued by the MIS MUST belong to this Trust Domain.
          examples:
            - factory.example
        trustBundleUri:
          type: string
          format: uri
          description: >
            Absolute HTTPS URL to the SPIFFE Bundle Map resource for this Trust
            Domain. A client MUST reject a value whose scheme is not https. The
            resource MUST contain an entry for the domain named by trustDomain;
            that entry is the authoritative local Trust Bundle.
          examples:
            - https://mis.factory.example/.well-known/spiffe/bundle.json
    SpiffeBundleMap:
      type: object
      description: >
        SPIFFE Bundle Map. The concrete schema is defined by the SPIFFE Trust
        Domain and Bundle Map specification; the map is keyed by Trust Domain
        identifier. A client MUST reject the map, and MUST NOT validate SVIDs
        against it, if it contains no entry for the local trustDomain or that
        entry carries no X.509 trust anchors (fail closed). A JWKS slot MAY be
        present but is not populated by MIAF and MUST be ignored on retrieval.
      additionalProperties: true
      examples:
        - trust_domains:
            factory.example:
              spiffe_sequence: 12
              spiffe_refresh_hint: 86400
              keys:
                - kty: EC
                  crv: P-256
                  x: <base64url-encoded EC public key x coordinate>
                  y: <base64url-encoded EC public key y coordinate>
                  use: x509-svid
                  x5c:
                    - <base64 DER of the Trust Domain's X.509 authority certificate>
