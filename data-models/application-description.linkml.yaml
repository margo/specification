# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/application-schema
name: ApplicationDescription
title: Application Description Schema
description: >-
  Schema for defining application metadata, deployment profiles, and parameters.
  The purpose of the Application Description is to enable an application's discovery, configuration, and deployment on edge devices.
version: 1.0
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
imports:
  - linkml:types

default_prefix: margo


# Class Definitions
classes:
  ApplicationDescription:
    description: Root class for an application description.
    attributes:
      apiVersion:
        description: Identifier of the version of the API the object definition follows.
        required: true
        range: string
      kind:
        description: Specifies the object type; must be `ApplicationDescription`.
        range: string
        required: true
        equals_string: "ApplicationDescription"
        designates_type: true
      metadata:
        description: >-
          Metadata element specifying characteristics about the application deployment.
          See the [Metadata Attributes](#metadata-attributes) section below.
        range: Metadata
        required: true
      deploymentProfiles:
        description: >-
          Deployment profiles element specifying the types of deployments the application supports.
          See the [Deployment](#deploymentprofile-attributes) section below.
        range: DeploymentProfile
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
      parameters:
        description: >-
          Parameters element specifying the configurable parameters to use when installing, or updating, the application.
          See the [Parameter](#parameter-attributes) section below.
        range: Parameter
        multivalued: true
        inlined: true
        inlined_as_list: false
      configuration:
        description: >-
          Configuration element specifying how parameters should be displayed to the user for setting the value
          as well as the rules to use to validate the user's input.
          See the [Configuration](#configuration-attributes) section below.
        range: Configuration

  Metadata:
    description: Metadata about the application.
    attributes:
      id:
        description: >-
          An identifier for the application. The id is used to help create unique identifiers where required,
          such as namespaces. The id must be lower case letters and numbers and MAY contain dashes.
          Uppercase letters, underscores and periods MUST NOT be used. The id MUST NOT be more than 200 characters.
        range: string
        required: true
        pattern: ^[a-z0-9-]{1,200}$
      name:
        description: >-
          The application's official name.
          This name is for display purposes only and can container whitespace and special characters.
        range: string
        required: true
      description:
        range: string
      version:
        description: The application's version.
        range: string
        required: true
      catalog:
        description: >-
          Catalog element specifying the application's metadata for enabling its discovery.
          See the [Catalog](#catalog-attributes) section below.
        range: Catalog
        required: true

  Catalog:
    description: Catalog metadata for displaying the application.
    attributes:
      application:
        description: >-
          Application element specifying the application specific metadata.
          See the [Application Metadata](#applicationmetadata-attributes) section below.
        range: ApplicationMetadata
      author:
        description: >-
          Author element specifying metadata about the application's author.
          See the [Author Metadata](#author-attributes) section below.
        range: Author
        multivalued: true
        inlined: true
        inlined_as_list: true
      organization:
        description: >-
          Organization element specifying metadata about the organization/company providing the application.
          See the [Organization Metadata](#organization-attributes) section below.
        range: Organization
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  ApplicationMetadata:
    description: Metadata specific to the application.
    attributes:
      descriptionFile:
        description: Link to the file containing the application's full description. The file should be a markdown file.
        range: string
      icon:
        description: Link to the icon file (e.g., in PNG format).
        range: string
      licenseFile:
        description: Link to the file that details the application's license. The file should either be a plain text, markdown or PDF file.
        range: string
      releaseNotes:
        description: Statement about the changes for this application's release. The file should either be a markdown or PDF file.
        range: string
      site:
        description: Link to the application's website.
        range: string
      tagline:
        description: The application's slogan.
        range: string
      tags:
        description: An array of strings that can be used to provide additional context for the application in a user interface to assist with task such as categorizing, searching, etc.
        range: string
        multivalued: true
        inlined: true
        inlined_as_list: true

  Author:
    description: Information about the application's author.
    attributes:
      name:
        description: The name of the application's creator.
        range: string
      email:
        description: Email address of the application's creator.
        range: string
        pattern: .*@[a-z0-9.-]*

  Organization:
    description: Information about the providing organization.
    attributes:
      name:
        description: Organization responsible for the application's development and distribution.
        range: string
        required: true
      site:
        description: Link to the organization's website.
        range: string

  DeploymentProfile:
    description: Represents a deployment configuration for the application.
    attributes:
      id:
        description: >-
          An identifier for the deployment profile, given by the application developer, used to uniquely identify this deployment profile from others within this application description's scope.
        range: string
        required: true
      description:
        description: >-
          This human-readable description of a deployment profile allows for providing additional context about the deployment profile. E.g., the application developer can use this to describe the deployment profile's purpose,
          such as the intended use case. Additionally, the application developer can use this to provide further details about the resources, peripherals, and interfaces required to run the application.
        range: string
        required: false
      requiredResources:
        description: >-
          Required resources element specifying the resources required to install the application.
          See the [Required Resources](#requiredresources-attributes) section below.
          The consequences (e.g., aborting / blocking the installation or execution of the application) of not meeting these required resources are not defined (yet) by margo.
        range: RequiredResources
        required: false
    slots:
      - type
      - components

  RequiredResources:
    description: >-
      Required resources element specifying the resources required to install the application.
    attributes:
      cpu:
        description: >-
          CPU element specifying the CPU requirements for the application.
          See the [CPU](#cpu-attributes) section below.
        range: CPU
        required: false
      memory:
        description: The minimum amount of memory required.
          The value is given in binary units (`Ki` = Kibibytes, `Mi` = Mebibytes, `Gi` = Gibibytes).
          This is defined by the application developer.
          After deployment of the application, the device MUST provide this amount of memory for the application.
        range: string
        pattern: ^[0-9]+(Mi|Gi|Ki)$
        required: false
      storage:
        description: The amount of storage required for the application to run. This encompasses the installed application and the data it needs to store.
          The value is given in binary units (`Ki` = Kibibytes, `Mi` = Mebibytes, `Gi` = Gibibytes, `Ti` Tebibytes, `Pi` = Pebibytes, `Ei` = Exbibytes).
          This is defined by the application developer.
          After deployment of the application, the device MUST provide this amount of storage for the application
        range: string
        pattern: ^[0-9]+(Mi|Gi|Ki|Ti|Pi|Ei)$
        required: false
      peripherals:
        description: >-
          Peripherals element specifying the peripherals required to run the application.
          See the [Peripheral](#peripheral-attributes) section below.
        range: Peripheral
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: false
      interfaces:
        description: >-
          Interfaces element specifying the communication interfaces required to run the application.
          See the [Communication Interfaces](#communicationinterface-attributes) section below.
        range: CommunicationInterface
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: false

  CPU:
    description: >-
      CPU element specifying the CPU requirements for the application.
    attributes:
      cores:
        description: The required amount of CPU cores the application must use to run in its full functionality.
          Specified as decimal units of CPU cores (e.g., `0.5` is half a core).
          This is defined by the application developer.
          After deployment of the application, the device MUST provide this number of CPU cores for the application.
        range: double
        required: true
      architectures:
        description: The CPU architectures supported by the application. This can be e.g. amd64, x86_64, arm64, arm.
          See the [CpuArchitectureType](#cpuarchitecturetype) definition for all permissible values.
          Multiple arcitecture types can be specified, as the deployment profile may support multiple CPU architectures.
        range: CpuArchitectureType
        required: false
        multivalued: true

  Peripheral:
    description: Peripheral hardware of a device.
    attributes:
      type:
        description: The type of peripheral. This can be e.g. GPU, display, camera, microphone, speaker.
          See the [PeriperalType](#peripheraltype) definition for all permissible values.
        range: PeripheralType
        required: true
      manufacturer:
        description: The name of the manufacturer. If `manufacturer` is specified as a requirement here, it may be difficult to find devices that can host the  application. Please use these requirements with caution.
        range: string
        required: false
      model:
        description: The model of the peripheral. If `model` is specified as a requirement here, it may be difficult to find devices that can host the application. Please use these requirements with caution.
        range: string
        required: false

  CommunicationInterface:
    description: >-
      Communication interface of a device.
    attributes:
      type:
        description: The type of a communication interface. This can be e.g. Ethernet, WiFi, Cellular, Bluetooth, USB, CANBus, RS232.
          See the [CommunicationInterfaceType](#communicationinterfacetype) definition for all permissible values.
        range: CommunicationInterfaceType
        required: true

  HelmDeploymentProfile:
    is_a: DeploymentProfile
    slot_usage:
      type:
        equals_string: "helm.v3"
      components:
        range: HelmComponent

  ComposeDeploymentProfile:
    is_a: DeploymentProfile
    slot_usage:
      type:
        equals_string: "compose"
      components:
        range: ComposeComponent

  Component:
    description: A class representing a component of a deployment profile.
    attributes:
      name:
        description: >-
          A unique name used to identify the component package. For helm installations the name will be used as the chart name.
          The name must be lower case letters and numbers and MAY contain dashes.
          Uppercase letters, underscores and periods MUST NOT be used.
        required: true
        range: string
      properties:
        description: >-
           A dictionary element specifying the component packages's deployment details.
           See the [Component Properties](#componentproperties-attributes) section below.
        range: ComponentProperties
        required: true

  HelmComponent:
    is_a: Component

  ComposeComponent:
    is_a: Component

  ComponentProperties:
    description: Properties dictionary for component deployment details.
    attributes:
      repository:
        description: Repository location for the component.
        range: string
      revision:
        description: Revision version for the component.
        range: string
      wait:
        description: If True, indicates the device waits for the component installation to complete.
        range: boolean
      timeout:
        description: Time to wait for component installation to complete, formatted as "##m##s".
        range: string
      packageLocation:
        description: URL indicating the Compose package's location.
        range: string
      keyLocation:
        description: URL for the public key used to validate a digitally signed package.
        range: string

  Parameter:
    description: Defines a configurable parameter for the application.
    attributes:
      name:
        description: Name of the parameter.
        identifier: true
        required: true
        range: string
      value:
        description: >-
          The parameter's default value.
          Accepted data types are string, integer, double, boolean, array[string], array[integer], array[double], array[boolean].
        any_of: #support for arrays still TBD
          - range: boolean
          - range: integer
          - range: double
          - range: string
      targets:
        description: >-
          Used to indicate which component the value should be applied to when installing, or updating, the application.
          See the [Target](#target-attributes) section below.
        range: Target
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true

  Target:
    description: Specifies where the parameter applies in the deployment.
    attributes:
      pointer:
        description: >-
          The name of the parameter in the deployment configuration.
          For Helm deployments, this is the dot notation for the matching element in the `values.yaml` file. This follows the same naming convention you would use with the `--set` command line argument with the `helm install` command.
          For compose deployments, this is the name of the environment variable to set.
        range: string
        required: true
      components:
        description: >-
          Indicates which deployment profile [component](#component-attributes the parameter target applies to.
          The component name specified here MUST match a component name in the [deployment profiles](#deploymentprofile-attributes) section.
        range: string
        multivalued: true
        required: true

  Configuration:
    description: Configuration layout and validation rules.
    attributes:
      sections:
        description: >-
          Sections are used to group related parameters together,
          so it is possible to present a user interface with a logical grouping of the parameters in each section.
          See the [Section](#section-attributes) section below.
        range: Section
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
      schema:
        description: >-
          Schema is used to provide details about how to validate each parameter value.
          At a minimum, the parameter value must be validated to match the schema's data type.
          The schema indicates additional rules the provided value must satisfy to be considered valid input.
          See the [Schema](#schema-attributes) section below.
        range: Schema
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true

  Section:
    description: Named sections within the configuration layout.
    attributes:
      name:
        description: >-
          The name of the section. This may be used in the user interface to show the grouping of the associated parameters within the section.
        range: string
        required: true
      settings:
        description: >-
          Settings are used to provide instructions to the workload orchestration software vendor for displaying parameters to the user.
          A user MUST be able to provide values for all settings.
          See the [Setting](#setting-attributes) section below.
        range: Setting
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true

  Setting:
    description: Individual configuration settings.
    attributes:
      parameter:
        description: The name of the [parameter](#parameter-attributes) the setting is associated with.
        range: string
        required: true
      name:
        description: The parameter's display name to show in the user interface.
        range: string
        required: true
      description:
        description: The parameters's short description to provide additional context to the user in the user interface about what the parameter is for.
        range: string
      immutable:
        description: If true, indicates the parameter value MUST not be changed once it has been set and used to install the application. Default is false if not provided.
        range: boolean
      schema:
        description: The name of the schema definition to use to validate the parameter's value. See the [Schema](#schema-attributes) section below.
        range: string
        required: true

  Schema:
    description: Defines data type and rules for validating user provided parameter values. Subclasses (see below) define for each data type their own set of validation rules that can be used. The value MUST be validated against all rules defined in the schema.
    attributes:
      name:
        description: The name of the schema rule. This used in the [setting](#setting-attributes) to link the setting to the schema rule.
        range: string
        required: true
      dataType:
        description: >-
          Indicates the expected data type for the user provided value.
          Accepted values are string, integer, double, boolean, array[string], array[integer], array[double], array[boolean].
          At a minimum, the provided parameter value MUST match the schema's data type if no other validation rules are provided.
        range: string
        required: true
      #validationRule:
      #  description: >-
      #    Defines the validation rules to use to validate the user provided parameter value.
      #    The rules are based on the schema's data type and are listed below.
      #    The value MUST be validated against any validation rules defined in the schema.
      #  range: ValidationRule
      #  required: false

  TextValidationSchema:
    is_a: Schema
    description: Extends schema to define a string/text-specific set of validation rules that can be used.
    attributes:
      allowEmpty:
        description: >-
          If true, indicates a value must be provided. Default is false if not provided.
        range: boolean
        required: false
      minLength:
        description: If set, indicates the minimum number of characters the value must have to be considered valid.
        range: integer
        required: false
      maxLength:
        description: If set, indicates the maximum number of characters the value must have to be considered valid.
        range: integer
        required: false
      regexMatch:
        description: If set, indicates a regular expression to use to validate the value.
        range: string
        required: false

  BooleanValidationSchema:
    is_a: Schema
    description: Extends schema to define a boolean-specific set of validation rules that can be used.
    attributes:
      allowEmpty:
        description: >-
          If true, indicates a value must be provided. Default is false if not provided.
        range: boolean
        required: false

  NumericIntegerValidationSchema:
    is_a: Schema
    description: Extends schema to define a integer-specific set of validation rules that can be used.
    attributes:
      allowEmpty:
        description: >-
          If true, indicates a value must be provided. Default is false if not provided.
        range: boolean
        required: false
      minValue:
        description: If set, indicates the minimum allowed integer value the value must have to be considered valid.
        range: integer
        required: false
      maxValue:
        description: If set, indicates the maximum allowed integer value the value must have to be considered valid.
        range: integer
        required: false

  NumericDoubleValidationSchema:
    is_a: Schema
    description: Extends schema to define a double-specific set of validation rules that can be used.
    attributes:
      allowEmpty:
        description: >-
          If true, indicates a value must be provided. Default is false if not provided.
        range: boolean
        required: false
      minValue:
        description: If set, indicates the minimum value to be considered valid.
        range: float
        required: false
      maxValue:
        description: If set, indicates the maximum value to be considered valid.
        range: float
        required: false
      minPrecision:
        description: If set, indicates the minimum level of precision the value must have to be considered valid.
        range: integer
        required: false
      maxPrecision:
        description: If set, indicates the maximum level of precision the value must have to be considered valid.
        range: integer
        required: false

  SelectValidationSchema:
    is_a: Schema
    description: Extends schema to define a specific set of validation rules that can be used for select options.
    attributes:
      allowEmpty:
        description: >-
          If true, indicates a value must be provided. Default is false if not provided.
        range: boolean
        required: false
      multiselect:
        description: If true, indicates multiple values can be selected. If multiple values can be selected the resulting value is an array of the selected values. The default is false if not provided.
        range: boolean
        required: false
      options:
        description: This provides the list of acceptable options the user can select from. The data type for each option must match the parameter setting’s data type.
        range: string
        multivalued: true
        required: true

slots:
  type:
    description: >-
          Defines the type of this deployment configuration for the application.
          The allowed values are `helm.v3`, to indicate the deployment profile's format is Helm version 3,
          and `compose` to indicate the deployment profile's format is a Compose file.
          When installing the application on a device supporting the Kubernetes platform, all `helm.v3` components,
          and only `helm.v3` components, will be provided to the device in same order they are listed in the application description file.
          When installing the application on a device supporting Compose, all `compose` components,
          and only `compose` components, will be provided to the device in the same order they are listed in the application description file.
          The device will install the components in the same order they are listed in the application description file.
    range: string
    required: true
    pattern: ^(helm\.v3|compose)$

  components:
    description: >-
      Component element indicating the components to deploy when installing the application.
      See the [Component](#component-attributes) section below.
    range: Component
    multivalued: true
    required: true
    inlined: true
    inlined_as_list: true

enums:
  CpuArchitectureType:
    permissible_values:
      amd64:
        description: AMD 64-bit architecture.
      x86_64:
        description: x86 64-bit architecture.
      arm64:
        description: ARM 64-bit architecture.
      arm:
        description: ARM 32-bit architecture.
      riscv64:
        description: RISC-V 64-bit architecture.
      other:
        description: >-
          Any other CPU architecture not listed here. The application developer MUST provide a description of the architecture in the deployment profile's `description` field.

  CommunicationInterfaceType:
    permissible_values:
      ethernet:
        description: This type stands for an Ethernet interface.
      wifi:
        description: This type stands for an WiFi interface.
      cellular:
        description: This type stands for cellular communication technologies such as 5G, LTE, 3G, 2G, ....
      bluetooth:
        description: This type stands for a Bluetooth or Bluetooth Low-Energy (BLE) interface.
      usb:
        description: This type stands for a USB interface.
      canbus:
        description: This type stands for a CANBus interface.
      rs232:
        description: This type stands for a RS232 interface.
      other:
        description: This type stands for any other communication interface not listed here. The application developer MUST provide a description of the interface in the deployment profile's `description` field.

  PeripheralType:
    permissible_values:
      gpu:
        description: This type stands for a Graphics Processing Unit (GPU) peripheral.
      display:
        description: This type stands for a display peripheral.
      camera:
        description: This type stands for a camera peripheral.
      microphone:
        description: This type stands for a microphone peripheral.
      speaker:
        description: This type stands for a speaker peripheral.
      other:
        description: This type stands for any other peripheral not listed here. The application developer MUST provide a description of the peripheral in the deployment profile's `description` field.

