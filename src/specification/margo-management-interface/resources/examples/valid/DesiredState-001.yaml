id: a3e2f5dc-912e-494f-8395-52cf3769bc06
metadata:
    name: com-northstartida-digitron-orchestrator-deployment
    namespace: margo-poc
    deviceId: edge-01
spec:
    applicationId: com-northstartida-digitron-orchestrator
    deploymentProfile:
        key: margo.org/deployment/helm
        components:
            - name: database-services
              properties:
                repository: oci://quay.io/charts/realtime-database-services
                revision: 2.3.7
                timeout: 8m30s
                wait: true
            - name: digitron-orchestrator
              properties:
                repository: oci://northstarida.azurecr.io/charts/northstarida-digitron-orchestrator
                revision: 1.0.9
                wait: true
        characteristics:
          - matchExpressions:
              - key: margo.org/resource/cpu
                property: /cpus
                operator: ContainsAny
                itemSelector:
                  matchExpressions:
                    - property: /cores
                      operator: GtEq
                      values: [1.5]
                    - property: /architecture
                      operator: In
                      values: ["amd64"]
              - key: margo.org/resource/memory
                property: /memory
                operator: GtEq
                values: [1]
              - key: margo.org/resource/storage
                property: /storage
                operator: GtEq
                values: [10]
              - key: margo.org/peripherals
                property: /peripherals
                operator: ContainsAll
                itemSelector:
                  matchExpressions:
                    - property: /type
                      operator: In
                      values: ["gpu"]
                    - property: /manufacturer
                      operator: In
                      values: ["NVIDIA"]
              - key: margo.org/interfaces
                property: /interfaces
                operator: ContainsAll
                itemSelector:
                  matchExpressions:
                    - property: /type
                      operator: In
                      values: ["ethernet", "bluetooth"]
    parameters:
        adminName:
            value: Some One
            targets:
                - pointer: administrator.name
                  components:
                    - digitron-orchestrator
        adminPrincipalName:
            value: someone@somewhere.com
            targets:
                - pointer: administrator.userPrincipalName
                  components:
                    - digitron-orchestrator
        cpuLimit:
            value: "4"
            targets:
                - pointer: settings.limits.cpu
                  components:
                    - digitron-orchestrator
        idpClientId:
            value: 123-ABC
            targets:
                - pointer: idp.clientId
                  components:
                    - digitron-orchestrator
        idpName:
            value: Azure AD
            targets:
                - pointer: idp.name
                  components:
                    - digitron-orchestrator
        idpProvider:
            value: aad
            targets:
                - pointer: idp.provider
                  components:
                    - digitron-orchestrator
        idpUrl:
            value: https://123-abc.com
            targets:
                - pointer: idp.providerUrl
                  components:
                    - digitron-orchestrator
                - pointer: idp.providerMetadata
                  components:
                    - digitron-orchestrator
        memoryLimit:
            value: "16384"
            targets:
                - pointer: settings.limits.memory
                  components:
                    - digitron-orchestrator
        pollFrequency:
            value: "120"
            targets:
                - pointer: settings.pollFrequency
                  components:
                    - digitron-orchestrator
                    - database-services
        siteId:
            value: SID-123-ABC
            targets:
                - pointer: settings.siteId
                  components:
                    - digitron-orchestrator
                    - database-services
