# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: http://specification.margo.org/desired_state_schema
name: DesiredState
description: >-
  Each workload is represented as an `ApplicationDeployment` YAML file that specifies its components, configuration, and parameters.
  This resource is delivered via the Desired State API and referenced by `id` in the Deployment Status API.
version: 1.0 #Arne: update later
prefixes:
  linkml: https://w3id.org/linkml/
  margo: http://specification.margo.org/
imports:
  - linkml:types

default_prefix: margo
default_range: string

classes:
  DesiredState:
    description: A class representing the desired state of an entity.
    attributes:
      id:
        description: >-
          The unique identifier UUID of the deployment specification.
          Needs to be assigned by the Workload Fleet Manager.
        required: true
        range: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        rank: 25
      metadata:
        description: >-
          Metadata element specifying characteristics about the application deployment.
          See the [Metadata Attributes](#metadata-attributes) section below.
        range: Metadata
        required: true
        rank: 30
      spec:
        description: >-
          Spec element that defines deployment profile and parameters associated with the application deployment.
          See the [Spec Attributes](#spec-attributes) section below.
        range: Spec
        required: true
        rank: 40

  Metadata:
    description: Metadata associated with the desired state.
    rank: 10
    attributes:
      name:
        description: >-
          When deploying to Kubernetes, the manifests name.
          The name is chosen by the Workload Fleet Management vendor and is not displayed anywhere.
        required: true
        range: string
        rank: 10
      namespace:
        description: When deploying to Kubernetes, the namespace the manifest is added under. The namespace is chosen by the Workload Fleet Management vendor.
        required: true
        range: string
        rank: 20
      deviceId:
        description: >-
          The id of the device, with hierarchy if applicable, to which the deployment is assigned.
          To reference a child-device the format is `{device-id}[/{device-id}[/...]]`. <br/>
          To request the gateway to choose the child-device, use `*` for the last segment in the hierarchy (i.e. `{device-id}[/{device-id}/...]/*`).
          If the gateway is not capable of autonomously selecting a child-device, it MUST send back a deployment status with error `103 - Autonomous placement not supported` when `*` is used.
        required: true
        pattern: '^[A-Za-z0-9._~-]+(\/[A-Za-z0-9._~-]+)*(\/\*)?$'
        rank: 30
  Spec:
    description: Specification details of the desired state.
    rank: 30
    attributes:
      applicationId:
        description: >-
          It MUST match the associated application description's top-level "id" attribute.
          It can be used to help create unique identifiers where required, such as namespaces.
        required: true
        range: string
        pattern: "^[-a-z0-9]{1,200}$"
        rank: 5
      deploymentProfile:
        description: Section that defines deployment details including type and components.
        range: DeploymentProfile
        required: true
        rank: 10
      parameters:
        description: >-
          Describes the configured parameters applied via the end-user.
          Defined as a map where each key is the parameter name matching a parameter defined in the ApplicationDescription
          (e.g., `mysqlDatabase:`, `greeting:`, `idpName:`, `myAppEndpoint:`); unrecognized keys are ignored.
        range: Parameter
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: false
        rank: 20
    slots:
      - x-placeholder-extensions

  DeploymentProfile:
    description: A class representing a deployment profile.
    rank: 40
    # abstract: true
    slots:
      - type
      - components
      - x-placeholder-extensions

  HelmDeploymentProfile:
    is_a: DeploymentProfile
    rank: 40
    slot_usage:
      type:
        equals_string: "helm"
        rank: 10
      components:
        range: HelmComponent
        rank: 20

  ComposeDeploymentProfile:
    is_a: DeploymentProfile
    rank: 40
    slot_usage:
      type:
        equals_string: "compose"
        rank: 10
      components:
        range: ComposeComponent
        rank: 20

  Component:
    description: A class representing a component of a deployment profile.
    rank: 50
    attributes:
      name:
        description: The name of the component.
        required: true
        rank: 10
      properties:
        description: >-
          Component deployment properties providing OCI coordinates and behavior settings.
          See the ComponentProperties section below.
        range: ComponentProperties
        required: true
        inlined: true
        rank: 20
    slots:
      - x-placeholder-extensions

  HelmComponent:
    is_a: Component
    rank: 50

  ComposeComponent:
    is_a: Component
    rank: 50

  ComponentProperties:
    rank: 82
    description: >-
      Typed component properties providing OCI coordinates
      and optional deployment behavior settings.
      Used by both Helm and Compose deployment types.
    attributes:
      repository:
        description: >-
          OCI repository URI for the component package
          (e.g., oci://registry.example.com/org/component-name).
          MUST be a valid OCI reference using the oci:// scheme.
        range: string
        required: true
        pattern: "^oci://.+"
        rank: 10
      revision:
        description: >-
          OCI tag identifying the component version within the repository
          (e.g., "1.0.0", "2.3.1", "1.0.0-rc1", "1.0.0_build.123").
          MUST be a valid SemVer 2.0 string without a leading `v`.
          SemVer build metadata separator `+` MUST be stored as `_`
          because `+` is not a valid OCI tag character.
          Implementations comparing this value against a SemVer string
          MUST convert `_` back to `+` before comparison.
        range: string
        required: true
        pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:_([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
        rank: 20
      wait:
        description: >-
          Whether to wait for component installation to complete before proceeding.
          For Helm: waits until the release is deployed.
          For Compose: waits until all containers reach running state.
          Default is true. Only applies when multiple components are provided.
        range: boolean
        required: false
        rank: 30
      timeout:
        description: >-
          Maximum time to wait for component installation to complete.
          Format is "##m##s" (e.g., "5m0s", "8m30s").
          If installation does not complete before timeout, deployment fails.
        range: string
        required: false
        pattern: "^\\d+m\\d+s$"
        rank: 40

  Parameter:
    description: A class representing a single parameter.
    rank: 60
    attributes:
      name:
        identifier: true
        required: true
        rank: 10
      value:
        description: The value of the parameter.
        required: true
        rank: 20
      targets:
        description: The targets associated with the parameter.
        range: Target
        multivalued: true
        required: true
        rank: 30

  Target:
    description: A class representing a target for a parameter.
    rank: 70
    attributes:
      pointer:
        description: The pointer indicating the location of the target.
        required: true
        rank: 10
      components:
        description: The components associated with the target.
        multivalued: true
        required: true
        rank: 20

slots:
  type:
    description: The type of deployment profile (e.g., helm, compose).
    range: string
    required: true
    rank: 10

  components:
    description: Components of the application
    range: Component
    multivalued: true
    required: true
    rank: 20

  x-placeholder-extensions:
    description: >-
      Allows addition of an arbitrary object (mapping)
      whose contents suppliers use to provide vendor-specific functionality beyond what is defined in
      the Margo specification. See the [Specification Extensions](#specification-extensions) section below for more details.
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: false
    rank: 999
